# TextCraft's core: documents, file loading and saving, language detection, search and fuzzy
# matching. No UI dependency, so a CLI or test can use it without egui.
[package]
name = "textcraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# encoding_rs: the WHATWG encodings' tables; chardetng: Firefox's guess for unlabelled bytes.
encoding_rs = "0.8"
chardetng = "1"
craft-sniff = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }

[dev-dependencies]
craft-testkit = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
