[package]
name = "textcraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.37"
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593", features = ["egui"] }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593", features = ["egui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
serde = { version = "1", features = ["derive"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "15cd58bbb5ea74abda83e541f34191e465163593" }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
winit = "0.30"
lucide-icons = "1.78"
textcraft-core = { path = "../core" }

[dev-dependencies]
# UI tests: drive the app by keyboard and read its AccessKit tree (accessibility.md).
egui_kittest = { version = "0.37", features = ["eframe"] }
